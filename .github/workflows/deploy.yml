name: Deploy to GitHub Pages

# Trigger saat push ke branch utama
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (semua file statis)
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload semua file di root repo, tanpa folder yang tidak perlu
          path: '.'
          # Hindari upload file sensitif atau tidak dibutuhkan
          exclude: |
            .git/**
            .github/**
            node_modules/**
            tools/**
            *.log

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
