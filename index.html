<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GITMANHWA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header: gaya foto 1, logo diganti GITMANHWA, abu + garis batas -->
  <header>
    <a href="index.html" class="logo">
      <div class="logo-icon">👁</div>
      <span>GITMANHWA</span>
    </a>
    <div class="header-actions">
      <div class="icon-btn">🔍</div>
      <div class="icon-btn">⬆</div>
    </div>
  </header>

  <!-- Featured: ambil struktur foto 1 -->
  <section class="featured">
    <div class="featured-card">
      <div class="featured-img">[Cover Featured]</div>
      <div class="featured-info">
        <h2 class="featured-title">Got Dropped Into A Ghost Story, Still Gotta Work</h2>
        <div class="badges">
          <span class="badge badge-score">★ 8.6</span>
          <span class="badge badge-new">New</span>
          <span class="badge badge-popular">Popular</span>
        </div>
        <p class="featured-desc">Sebuah acara dadakan untuk serial "fantasi modern" yang sangat kusukai sampai aku rela...</p>
      </div>
    </div>
  </section>

  <!-- Rekomendasi: ambil dari foto 2 -->
  <section class="section">
    <div class="section-header">
      <h3 class="section-title">Rekomendasi</h3>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="manhwa">Manhwa</button>
      <button class="tab" data-tab="manga">Manga</button>
      <button class="tab" data-tab="manhua">Manhua</button>
    </div>
    <div class="series-grid" id="series-grid">
      <!-- diisi JS dari data -->
    </div>
  </section>

  <!-- Update: ambil dari foto 2 -->
  <section class="section">
    <div class="section-header">
      <h3 class="section-title">Update</h3>
      <div class="tabs" style="margin:0">
        <button class="tab active">Project</button>
        <button class="tab">Mirror</button>
      </div>
    </div>
    <div class="update-list" id="update-list">
      <!-- diisi JS -->
    </div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
