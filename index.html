<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GITMANHWA - Baca Manhwa, Manga, Manhua</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="header-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">🦈</div>
        <span>GITMANHWA</span>
      </a>
      <div class="header-actions">
        <div class="icon-btn" id="searchBtn">🔍</div>
        <div class="icon-btn" id="profileBtn">👤</div>
      </div>
    </div>
  </header>

  <!-- ===== SEARCH MODAL ===== -->
  <div class="modal" id="searchModal">
    <div class="modal-content">
      <input type="text" id="searchInput" placeholder="Cari judul manhwa, manga, manhua...">
      <div id="searchResult"></div>
      <button class="close-modal" id="closeSearch">Tutup</button>
    </div>
  </div>

  <!-- ===== KONTEN HOME (default) ===== -->
  <div id="defaultContent" class="default-section">
    <!-- Slider -->
    <section class="featured-section">
      <div class="slider-container" id="sliderContainer"></div>
      <div class="slider-dots" id="sliderDots"></div>
    </section>

    <!-- Genre -->
    <section class="section">
      <div class="genre-filter" id="genreFilter">
        <button class="genre-btn active" data-genre="all">Semua</button>
        <button class="genre-btn" data-genre="action">Action</button>
        <button class="genre-btn" data-genre="romance">Romance</button>
        <button class="genre-btn" data-genre="fantasy">Fantasy</button>
        <button class="genre-btn" data-genre="horror">Horror</button>
        <button class="genre-btn" data-genre="comedy">Comedy</button>
        <button class="genre-btn" data-genre="drama">Drama</button>
      </div>
    </section>

    <!-- Pengumuman -->
    <section class="section announcement-section">
      <div class="section-header">
        <h3 class="section-title">Pengumuman</h3>
        <span class="see-all">Semua</span>
      </div>
      <div class="announcement-card">
        <div class="announcement-cover">🦈</div>
        <div class="announcement-text">Premium Sekarang Cuma 12500!!!</div>
      </div>
    </section>

    <!-- Grid Rekomendasi -->
    <section class="section">
      <div class="section-header">
        <h3 class="section-title">Rekomendasi</h3>
        <span class="section-count" id="seriesCount">0 series</span>
      </div>
      <div class="series-grid" id="seriesGrid">
        <div class="empty">Loading data...</div>
      </div>
    </section>

    <!-- Update Terbaru -->
    <section class="section">
      <div class="section-header">
        <h3 class="section-title">Update Terbaru</h3>
      </div>
      <div class="update-list" id="updateList">
        <div class="empty">Loading update...</div>
      </div>
    </section>
  </div>

  <!-- ===== KONTEN EXPLORE (Baru) ===== -->
  <div id="exploreContent" style="display:none;">
    <!-- Bagian 1: Hero Banner + Horizontal Scroll -->
    <section class="explore-section">
      <div class="hero-banner" id="heroBanner"></div>
      <div class="horizontal-scroll" id="horizontalScroll"></div>
    </section>

    <!-- Bagian 2: Grid Utama -->
    <section class="section">
      <div class="section-header">
        <h3 class="section-title">Semua Series</h3>
      </div>
      <div class="series-grid" id="exploreGrid"></div>
    </section>

    <!-- Bagian 3: Lanjut Baca + Tabs -->
    <section class="section continue-section">
      <div class="section-header">
        <h3 class="section-title">Lanjut Baca</h3>
      </div>
      <div class="continue-empty" id="continueEmpty">
        Belum ada Data<br><br>Kamu belum punya riwayat baca
      </div>

      <div class="explore-tabs">
        <button class="explore-tab active" data-tab="rekomendasi">Rekomendasi</button>
        <button class="explore-tab" data-tab="pilihan">Pilihan Admin</button>
      </div>

      <!-- Banner berubah sesuai tab -->
      <div class="hero-banner" id="tabBanner"></div>
    </section>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p>🦈 GITMANHWA &copy; 2026</p>
  </footer>

  <!-- ===== BOTTOM NAVIGATION ===== -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item" data-page="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </a>
    <a href="index.html?tab=explore" class="nav-item" data-page="explore">
      <span class="nav-icon">🧭</span>
      <span class="nav-label">Explore</span>
    </a>
    <a href="index.html?tab=library" class="nav-item" data-page="library">
      <span class="nav-icon">📚</span>
      <span class="nav-label">Library</span>
    </a>
    <a href="index.html?tab=all" class="nav-item" data-page="all">
      <span class="nav-icon">🔍</span>
      <span class="nav-label">All Series</span>
    </a>
  </nav>

  <script>
    // Blokir copy & cut
    document.addEventListener('copy', (e) => e.preventDefault());
    document.addEventListener('cut', (e) => e.preventDefault());
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
  <script src="js/app.js"></script>
</body>
</html>
