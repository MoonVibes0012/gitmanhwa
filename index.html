<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GITMANHWA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <div class="logo-icon">👁</div>
      <span>GITMANHWA</span>
    </a>
    <div class="header-actions">
      <div class="icon-btn">🔍</div>
      <div class="icon-btn">⬆</div>
    </div>
  </header>

  <section class="featured">
    <div class="featured-card">
      <img src="series/ed/cover.png" class="featured-img" style="width:100%;height:220px;object-fit:cover;" alt="Featured">
      <div class="featured-info">
        <h2 class="featured-title">Got Dropped Into A Ghost Story, Still Gotta Work</h2>
        <div class="badges">
          <span class="badge badge-score">★ 8.6</span>
          <span class="badge badge-new">New</span>
          <span class="badge badge-popular">Popular</span>
        </div>
        <p class="featured-desc">Sebuah acara dadakan untuk serial "fantasi modern" yang sangat kusukai sampai aku rela...</p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-header">
      <h3 class="section-title">Rekomendasi</h3>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="manhwa">Manhwa</button>
      <button class="tab" data-tab="manga">Manga</button>
      <button class="tab" data-tab="manhua">Manhua</button>
    </div>
    <div class="series-grid" id="series-grid"></div>
  </section>

  <section class="section">
    <div class="section-header">
      <h3 class="section-title">Update</h3>
    </div>
    <div class="update-list" id="update-list"></div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
