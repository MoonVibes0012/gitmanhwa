<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Series - GITMANHWA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="header-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">🦈</div>
        <span>GITMANHWA</span>
      </a>
      <nav class="nav-menu">
        <a href="index.html">Beranda</a>
        <a href="index.html?tab=all">Daftar Series</a>
      </nav>
    </div>
  </header>

  <!-- ===== DETAIL ===== -->
  <div id="seriesDetail">
    <div class="empty">Loading...</div>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      const container = document.getElementById('seriesDetail');

      fetch('data/series.json')
        .then(r => r.json())
        .then(data => {
          const series = data.find(s => s.id === id);
          if (!series) {
            container.innerHTML = `<div class="empty">Series tidak ditemukan</div>`;
            return;
          }

          const sorted = series.chapters.sort((a,b) => b.num - a.num);

          let coverHtml = '';
          if (series.cover) {
            coverHtml = `<img src="${series.cover}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`;
          }
          const fallback = `<div class="cover-fallback" style="display:${series.cover ? 'none' : 'flex'}">${series.title.charAt(0)}</div>`;

          const genreHtml = series.genre ? series.genre.map(g => `<span class="genre-tag">${g}</span>`).join('') : '';

          container.innerHTML = `
            <div class="series-detail-container">
              <div class="series-hero">
                <div class="series-hero-cover">
                  ${coverHtml}
                  ${fallback}
                </div>
                <div class="series-hero-info">
                  <h1>${series.title}</h1>
                  <div class="meta">
                    <span>${series.flag || '🏳️'}</span>
                    <span>${series.type || 'Manhwa'}</span>
                    <span class="status ${series.status === 'Ongoing' ? 'ongoing' : 'completed'}">${series.status || 'Ongoing'}</span>
                  </div>
                  ${series.author ? `<div class="author">✏️ ${series.author}</div>` : ''}
                  ${series.rating ? `<div class="rating">⭐ ${series.rating}</div>` : ''}
                  <div class="genre-list">${genreHtml}</div>
                  ${series.synopsis ? `<div class="synopsis">${series.synopsis}</div>` : ''}
                </div>
              </div>

              <div class="section">
                <h3 class="section-title">Daftar Chapter</h3>
                <div class="chapter-grid">
                  ${sorted.map(c => `
                    <a class="chapter-btn" href="reader.html?series=${series.id}&chapter=${c.folder}">
                      Chapter ${c.num}
                    </a>
                  `).join('')}
                </div>
              </div>
            </div>
          `;
        })
        .catch(err => {
          container.innerHTML = `<div class="empty">Gagal load data: ${err.message}</div>`;
        });
    })();
  </script>
</body>
</html>
