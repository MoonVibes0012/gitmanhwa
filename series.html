<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Series - GITMANHWA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="header-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">🦈</div>
        <span>GITMANHWA</span>
      </a>
      <div style="display:flex;gap:12px;font-size:14px;">
        <a href="index.html" style="color:var(--text);text-decoration:none;">Beranda</a>
        <a href="index.html?tab=all" style="color:var(--text);text-decoration:none;">Daftar Series</a>
      </div>
    </div>
  </header>

  <!-- ===== DETAIL ===== -->
  <div id="seriesDetail">
    <div class="empty">Loading...</div>
  </div>

  <script src="js/features.js"></script>
  <script>
    (function () {
      // Blokir copy
      document.addEventListener('copy', function (e) { e.preventDefault(); });
      document.addEventListener('cut', function (e) { e.preventDefault(); });
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      var params = new URLSearchParams(location.search);
      var id = params.get('id');
      var container = document.getElementById('seriesDetail');

      if (!id) {
        container.innerHTML = '<div class="empty">Series tidak ditemukan</div>';
        return;
      }

      fetch('data/series.json')
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          var series = null;
          for (var i = 0; i < data.length; i++) {
            if (data[i].id === id) {
              series = data[i];
              break;
            }
          }

          if (!series) {
            container.innerHTML = '<div class="empty">Series tidak ditemukan</div>';
            return;
          }

          // Urutkan chapter dari besar ke kecil
          var sorted = series.chapters.slice().sort(function (a, b) {
            return b.num - a.num;
          });

          // Cover
          var coverHtml = '';
          if (series.cover) {
            coverHtml = '<img src="' + series.cover + '" alt="' + series.title + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">';
          }
          var fallback = '<div class="cover-fallback" style="display:' + (series.cover ? 'none' : 'flex') + '">' + series.title.charAt(0) + '</div>';

          // Genre
          var genreHtml = '';
          if (series.genre && series.genre.length) {
            for (var g = 0; g < series.genre.length; g++) {
              genreHtml += '<span class="genre-tag">' + series.genre[g] + '</span>';
            }
          }

          // Status
          var statusClass = series.status === 'Ongoing' ? 'ongoing' : 'completed';

          // Chapter buttons
          var chapterHtml = '';
          for (var c = 0; c < sorted.length; c++) {
            chapterHtml += '<a class="chapter-btn" href="reader.html?series=' + series.id + '&chapter=' + sorted[c].folder + '">Chapter ' + sorted[c].num + '</a>';
          }

          container.innerHTML = 
            '<div class="series-detail-container">' +
              '<div class="series-hero">' +
                '<div class="series-hero-cover">' +
                  coverHtml +
                  fallback +
                '</div>' +
                '<div class="series-hero-info">' +
                  '<h1>' + series.title + '</h1>' +
                  '<div class="meta">' +
                    '<span>' + (series.flag || '🏳️') + '</span>' +
                    '<span>' + (series.type || 'Manhwa') + '</span>' +
                    '<span class="status ' + statusClass + '">' + (series.status || 'Ongoing') + '</span>' +
                  '</div>' +
                  (series.author ? '<div class="author">✏️ ' + series.author + '</div>' : '') +
                  (series.rating ? '<div class="rating">⭐ ' + series.rating + '</div>' : '') +
                  '<div class="genre-list">' + genreHtml + '</div>' +
                  (series.synopsis ? '<div class="synopsis">' + series.synopsis + '</div>' : '') +
                  '<button id="bookmarkBtn" style="margin-top:14px;padding:10px 18px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;">🤍 Bookmark</button>' +
                '</div>' +
              '</div>' +
              '<div class="section">' +
                '<h3 class="section-title">Daftar Chapter (' + sorted.length + ')</h3>' +
                '<div class="chapter-grid">' + chapterHtml + '</div>' +
              '</div>' +
            '</div>';

          // Bookmark
          var bookmarkBtn = document.getElementById('bookmarkBtn');
          if (bookmarkBtn && typeof Bookmark !== 'undefined') {
            function updateBtn() {
              if (Bookmark.exists(series.id)) {
                bookmarkBtn.innerHTML = '❤️ Bookmarked';
                bookmarkBtn.style.background = 'var(--accent)';
                bookmarkBtn.style.color = '#fff';
                bookmarkBtn.style.borderColor = 'var(--accent)';
              } else {
                bookmarkBtn.innerHTML = '🤍 Bookmark';
                bookmarkBtn.style.background = 'var(--card)';
                bookmarkBtn.style.color = 'var(--text)';
                bookmarkBtn.style.borderColor = 'var(--border)';
              }
            }

            updateBtn();

            bookmarkBtn.addEventListener('click', function () {
              var isBookmarked = Bookmark.toggle(series.id);
              updateBtn();

              var toast = document.createElement('div');
              toast.textContent = isBookmarked ? 'Ditambahkan ke Bookmark' : 'Dihapus dari Bookmark';
              toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:white;padding:12px 20px;border-radius:8px;font-size:14px;z-index:9999;';
              document.body.appendChild(toast);
              setTimeout(function () { toast.remove(); }, 2000);
            });
          }
        })
        .catch(function (err) {
          container.innerHTML = '<div class="empty">Gagal load data: ' + err.message + '</div>';
        });
    })();
  </script>
</body>
</html>
