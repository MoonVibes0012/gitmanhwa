<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Series - GITMANHWA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <div class="logo-icon">👁</div>
      <span>GITMANHWA</span>
    </a>
  </header>

  <div id="series-detail">
    <!-- diisi JS -->
  </div>

  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const series = SERIES.find(s => s.id === id);

    const container = document.getElementById("series-detail");
    if (!series) {
      container.innerHTML = `<div class="empty">Series tidak ditemukan</div>`;
    } else {
      container.innerHTML = `
        <div class="series-hero">
          <div class="series-hero-cover">
            ${series.cover ? `<img src="${series.cover}" style="width:100%;height:100%;object-fit:cover;border-radius:8px">` : series.title}
          </div>
          <div class="series-hero-info">
            <h1>${series.title}</h1>
            <div class="meta">${series.flag} · ${series.type} · ${series.status}</div>
            <div class="badges">
              <span class="badge badge-score">★ 8.0</span>
            </div>
          </div>
        </div>
        <div class="section">
          <h3 class="section-title" style="margin-bottom:12px">Chapter</h3>
          <div class="chapter-grid">
            ${series.chapters.map(c => `
              <a class="chapter-btn" href="reader.html?series=${series.id}&chapter=${c.folder}">
                Chapter ${c.num}
              </a>
            `).join("")}
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
