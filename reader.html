<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reader - GITMANHWA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="reader-header">
    <a href="#" id="backBtn">←</a>
    <div class="reader-title" id="reader-title">Loading...</div>
  </div>

  <div class="reader-pages" id="pages">
    <div class="empty">Memuat gambar...</div>
  </div>

  <div class="reader-nav">
    <button id="prevChapter">‹ Sebelumnya</button>
    <span id="chapterIndicator">1 / 1</span>
    <button id="nextChapter">Berikutnya ›</button>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(location.search);
      const seriesId = params.get("series");
      const chapterFolder = params.get("chapter");

      const pagesEl = document.getElementById("pages");
      const titleEl = document.getElementById("reader-title");
      const prevBtn = document.getElementById("prevChapter");
      const nextBtn = document.getElementById("nextChapter");
      const indicator = document.getElementById("chapterIndicator");
      const backBtn = document.getElementById("backBtn");

      let seriesData = null;
      let chapters = [];
      let currentIndex = -1;

      console.log('📖 Reader load:', seriesId, chapterFolder);

      // Tombol kembali ke series detail
      backBtn.addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = 'series.html?id=' + seriesId;
      });

      fetch('data/series.json')
        .then(r => {
          console.log('📡 Fetch status:', r.status);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(data => {
          console.log('✅ Data loaded, mencari series:', seriesId);
          seriesData = data.find(s => s.id === seriesId);
          if (!seriesData) throw new Error('Series tidak ditemukan');
          chapters = seriesData.chapters.sort((a,b) => b.num - a.num); // DESC: chapter 9 di index 0
          currentIndex = chapters.findIndex(c => c.folder === chapterFolder);
          if (currentIndex === -1) currentIndex = 0;
          titleEl.textContent = seriesData.title + ' · Ch.' + chapters[currentIndex].num;
          loadChapter(currentIndex);
          updateNav();
        })
        .catch(err => {
          console.error('❌ Error:', err);
          pagesEl.innerHTML = `<div class="empty">Error: ${err.message}</div>`;
        });

      function loadChapter(index) {
        const ch = chapters[index];
        if (!ch) return;
        pagesEl.innerHTML = '';
        const base = 'series/' + seriesId + '/' + ch.folder + '/';
        console.log('📂 Loading dari:', base);
        let pageNum = 1;
        const maxTry = 80;
        const formats = ['jpg', 'png', 'webp', 'bmp'];
        let formatIndex = 0;

        function pad(n) { return n.toString().padStart(2, '0'); }

        function tryLoad() {
          if (pageNum > maxTry) {
            console.log('📄 Selesai, total', pagesEl.children.length, 'gambar');
            return;
          }
          const img = new Image();
          const src = base + pad(pageNum) + '.' + formats[formatIndex];
          img.src = src;
          img.onload = function() {
            pagesEl.appendChild(img);
            pageNum++;
            formatIndex = 0;
            tryLoad();
          };
          img.onerror = function() {
            formatIndex++;
            if (formatIndex < formats.length) {
              tryLoad();
            } else {
              formatIndex = 0;
              pageNum++;
              tryLoad();
            }
          };
        }

        let firstTry = 0;
        function firstLoad() {
          const img = new Image();
          const src = base + pad(1) + '.' + formats[firstTry % formats.length];
          img.src = src;
          img.onload = function() {
            pagesEl.appendChild(img);
            pageNum = 2;
            formatIndex = 0;
            tryLoad();
          };
          img.onerror = function() {
            firstTry++;
            if (firstTry < 10) {
              firstLoad();
            } else {
              console.error('❌ Gagal load gambar pertama');
              pagesEl.innerHTML = `<div class="empty">Tidak ada gambar di folder ${base}</div>`;
            }
          };
        }
        firstLoad();

        try {
          localStorage.setItem('gitmanhwa_progress_' + seriesId, JSON.stringify({
            chapter: ch.folder,
            scrollY: 0
          }));
        } catch(e) {}
      }

      function updateNav() {
        indicator.textContent = (currentIndex + 1) + ' / ' + chapters.length;
        // Karena DESC: index 0 = chapter tertinggi, index terakhir = chapter terendah
        // "Sebelumnya" artinya ke chapter lebih rendah (index + 1)
        prevBtn.disabled = currentIndex === chapters.length - 1;
        // "Berikutnya" artinya ke chapter lebih tinggi (index - 1)
        nextBtn.disabled = currentIndex === 0;
      }

      // PERBAIKAN: sebelumnya = ke index lebih besar (chapter lebih rendah)
      prevBtn.addEventListener('click', function() {
        if (currentIndex < chapters.length - 1) {
          currentIndex++;
          const ch = chapters[currentIndex];
          history.pushState(null, '', 'reader.html?series=' + seriesId + '&chapter=' + ch.folder);
          loadChapter(currentIndex);
          updateNav();
          window.scrollTo(0, 0);
        }
      });

      // PERBAIKAN: berikutnya = ke index lebih kecil (chapter lebih tinggi)
      nextBtn.addEventListener('click', function() {
        if (currentIndex > 0) {
          currentIndex--;
          const ch = chapters[currentIndex];
          history.pushState(null, '', 'reader.html?series=' + seriesId + '&chapter=' + ch.folder);
          loadChapter(currentIndex);
          updateNav();
          window.scrollTo(0, 0);
        }
      });

      window.addEventListener('load', function() {
        try {
          const saved = localStorage.getItem('gitmanhwa_progress_' + seriesId);
          if (saved) {
            const data = JSON.parse(saved);
            if (data.scrollY) window.scrollTo(0, data.scrollY);
          }
        } catch(e) {}
      });

      let scrollTimer;
      window.addEventListener('scroll', function() {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function() {
          try {
            const progress = {
              chapter: chapters[currentIndex]?.folder || '',
              scrollY: window.scrollY
            };
            localStorage.setItem('gitmanhwa_progress_' + seriesId, JSON.stringify(progress));
          } catch(e) {}
        }, 500);
      });
    })();
  </script>
</body>
</html>
