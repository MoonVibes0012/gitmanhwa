<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reader - GITMANHWA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== READER HEADER ===== -->
  <div class="reader-header">
    <a href="#" id="backBtn">←</a>
    <div class="reader-title" id="readerTitle">Loading...</div>
    <select id="chapterSelect" class="chapter-select"></select>
  </div>

  <!-- ===== PAGES ===== -->
  <div class="reader-pages" id="pages">
    <div class="empty">Memuat gambar...</div>
  </div>

  <!-- ===== NAVIGASI ===== -->
  <div class="reader-nav">
    <button id="prevChapter">‹ Sebelumnya</button>
    <span id="chapterIndicator">1 / ?</span>
    <button id="nextChapter">Berikutnya ›</button>
  </div>

  <script>
    (function() {
      // Blokir copy
      document.addEventListener('copy', (e) => e.preventDefault());
      document.addEventListener('cut', (e) => e.preventDefault());
      document.addEventListener('contextmenu', (e) => e.preventDefault());

      const params = new URLSearchParams(location.search);
      const seriesId = params.get('series');
      const chapterFolder = params.get('chapter');

      const pagesEl = document.getElementById('pages');
      const titleEl = document.getElementById('readerTitle');
      const prevBtn = document.getElementById('prevChapter');
      const nextBtn = document.getElementById('nextChapter');
      const indicator = document.getElementById('chapterIndicator');
      const backBtn = document.getElementById('backBtn');
      const chapterSelect = document.getElementById('chapterSelect');

      let chapters = [];
      let currentIndex = -1;
      let totalPagesFound = 0;

      backBtn.addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = 'series.html?id=' + seriesId;
      });

      fetch('data/series.json')
        .then(r => r.json())
        .then(data => {
          const seriesData = data.find(s => s.id === seriesId);
          if (!seriesData) throw new Error('Series tidak ditemukan');
          chapters = seriesData.chapters.sort((a,b) => b.num - a.num);
          currentIndex = chapters.findIndex(c => c.folder === chapterFolder);
          if (currentIndex === -1) currentIndex = 0;

          titleEl.textContent = seriesData.title;

          chapterSelect.innerHTML = '';
          chapters.forEach((c, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = 'Chapter ' + c.num;
            if (i === currentIndex) opt.selected = true;
            chapterSelect.appendChild(opt);
          });

          chapterSelect.addEventListener('change', function() {
            const idx = parseInt(this.value);
            if (idx !== currentIndex) {
              currentIndex = idx;
              const ch = chapters[currentIndex];
              history.pushState(null, '', 'reader.html?series=' + seriesId + '&chapter=' + ch.folder);
              loadChapter(currentIndex);
              window.scrollTo(0, 0);
            }
          });

          loadChapter(currentIndex);
        })
        .catch(err => {
          pagesEl.innerHTML = `<div class="empty">Error: ${err.message}</div>`;
        });

      // ===== SCAN CEPAT: Coba .jpg dulu, kalau gagal coba format lain =====
      function fastScanPage(base, pageNum) {
        return new Promise((resolve) => {
          const pad = String(pageNum).padStart(2, '0');
          // Coba jpg dulu (paling umum)
          const img = new Image();
          img.onload = () => resolve(base + pad + '.jpg');
          img.onerror = () => {
            // Kalau jpg gagal, coba format lain (png, webp, jpeg, bmp)
            const formats = ['png', 'webp', 'jpeg', 'bmp'];
            let attempt = 0;
            const tryFormat = () => {
              if (attempt >= formats.length) {
                resolve(null);
                return;
              }
              const img2 = new Image();
              img2.onload = () => resolve(base + pad + '.' + formats[attempt]);
              img2.onerror = () => {
                attempt++;
                tryFormat();
              };
              img2.src = base + pad + '.' + formats[attempt];
            };
            tryFormat();
          };
          img.src = base + pad + '.jpg';
        });
      }

      // ===== RENDER PER 40 HALAMAN =====
      function loadChapter(index) {
        const ch = chapters[index];
        if (!ch) return;

        // Reset
        pagesEl.innerHTML = '<div class="empty">Memuat gambar...</div>';
        const base = 'series/' + seriesId + '/' + ch.folder + '/';
        totalPagesFound = 0;
        let stopScan = false;

        // Scan maksimal 200 halaman
        async function scanAll() {
          const imageList = [];
          for (let i = 1; i <= 200; i++) {
            if (stopScan) break;
            const src = await fastScanPage(base, i);
            if (src) {
              imageList.push(src);
            } else {
              // Kalau halaman 1 tidak ada, langsung stop
              if (i === 1) {
                stopScan = true;
              }
              // Kalau ada gap di tengah (misal 5 gagal, 6 ada), stop aja biar aman
              break;
            }
          }
          return imageList;
        }

        scanAll().then(imageList => {
          if (imageList.length === 0) {
            pagesEl.innerHTML = '<div class="empty">Tidak ada gambar di folder ini.</div>';
            return;
          }

          totalPagesFound = imageList.length;
          indicator.textContent = '1 / ' + totalPagesFound;

          // Render per 40 halaman
          const batchSize = 40;
          let currentBatch = 0;
          pagesEl.innerHTML = '';

          function renderBatch() {
            const start = currentBatch * batchSize;
            const end = Math.min(start + batchSize, imageList.length);
            
            for (let i = start; i < end; i++) {
              const img = document.createElement('img');
              img.src = imageList[i];
              img.loading = 'eager';
              img.decoding = 'async';
              img.alt = 'Page ' + (i + 1);
              img.style.display = 'block';
              img.style.width = '100%';
              img.style.height = 'auto';
              pagesEl.appendChild(img);
            }

            currentBatch++;

            // Kalau masih ada batch berikutnya, render lagi setelah sedikit delay (biar UI nggak freeze)
            if (currentBatch * batchSize < imageList.length) {
              setTimeout(renderBatch, 50);
            } else {
              // Semua sudah dirender, update total
              indicator.textContent = '1 / ' + totalPagesFound;
              // Scroll ke posisi tersimpan
              try {
                const saved = localStorage.getItem('gitmanhwa_progress_' + seriesId);
                if (saved) {
                  const data = JSON.parse(saved);
                  if (data.scrollY) window.scrollTo(0, data.scrollY);
                }
              } catch(e) {}
            }
          }

          renderBatch();

          // Simpan progress
          try {
            localStorage.setItem('gitmanhwa_progress_' + seriesId, JSON.stringify({
              chapter: ch.folder,
              scrollY: 0
            }));
          } catch(e) {}
        });
      }

      // ===== UPDATE INDICATOR SAAT SCROLL =====
      let scrollTimer;
      window.addEventListener('scroll', function() {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          const imgs = pagesEl.querySelectorAll('img');
          const currentY = window.scrollY;
          let activeIndex = 1;
          for (let i = 0; i < imgs.length; i++) {
            const imgTop = imgs[i].offsetTop;
            const imgBottom = imgTop + imgs[i].offsetHeight;
            if (currentY >= imgTop - 100 && currentY < imgBottom - 100) {
              activeIndex = i + 1;
              break;
            }
          }
          if (totalPagesFound > 0) {
            indicator.textContent = activeIndex + ' / ' + totalPagesFound;
          }

          // Simpan scroll progress
          try {
            const progress = {
              chapter: chapters[currentIndex]?.folder || '',
              scrollY: currentY
            };
            localStorage.setItem('gitmanhwa_progress_' + seriesId, JSON.stringify(progress));
          } catch(e) {}
        }, 200);
      });

      // ===== NAVIGASI CHAPTER =====
      function updateNav() {
        indicator.textContent = (currentIndex + 1) + ' / ' + chapters.length;
        prevBtn.disabled = currentIndex === chapters.length - 1;
        nextBtn.disabled = currentIndex === 0;
        if (chapterSelect) chapterSelect.value = currentIndex;
      }

      const newPrev = prevBtn.cloneNode(true);
      const newNext = nextBtn.cloneNode(true);
      prevBtn.parentNode.replaceChild(newPrev, prevBtn);
      nextBtn.parentNode.replaceChild(newNext, nextBtn);

      newPrev.addEventListener('click', function() {
        if (currentIndex < chapters.length - 1) {
          currentIndex++;
          const ch = chapters[currentIndex];
          history.pushState(null, '', 'reader.html?series=' + seriesId + '&chapter=' + ch.folder);
          loadChapter(currentIndex);
          updateNav();
          window.scrollTo(0, 0);
        }
      });

      newNext.addEventListener('click', function() {
        if (currentIndex > 0) {
          currentIndex--;
          const ch = chapters[currentIndex];
          history.pushState(null, '', 'reader.html?series=' + seriesId + '&chapter=' + ch.folder);
          loadChapter(currentIndex);
          updateNav();
          window.scrollTo(0, 0);
        }
      });

      // Keyboard shortcut
      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') newPrev.click();
        if (e.key === 'ArrowRight') newNext.click();
      });

      updateNav();
    })();
  </script>
</body>
</html>
