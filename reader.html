<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reader - GITMANHWA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== READER HEADER ===== -->
  <div class="reader-header">
    <a href="#" id="backBtn">←</a>
    <div class="reader-title" id="readerTitle">Loading...</div>
    <select id="chapterSelect" class="chapter-select">
      <!-- diisi JS -->
    </select>
  </div>

  <!-- ===== PAGES ===== -->
  <div class="reader-pages" id="pages">
    <div class="empty">Memuat gambar...</div>
  </div>

  <!-- ===== NAVIGASI ===== -->
  <div class="reader-nav">
    <button id="prevChapter">‹ Sebelumnya</button>
    <span id="chapterIndicator">1 / 1</span>
    <button id="nextChapter">Berikutnya ›</button>
  </div>

  <script>
    (function() {
      // Blokir copy
      document.addEventListener('copy', (e) => e.preventDefault());
      document.addEventListener('cut', (e) => e.preventDefault());
      document.addEventListener('contextmenu', (e) => e.preventDefault());

      const params = new URLSearchParams(location.search);
      const seriesId = params.get('series');
      const chapterFolder = params.get('chapter');

      const pagesEl = document.getElementById('pages');
      const titleEl = document.getElementById('readerTitle');
      const prevBtn = document.getElementById('prevChapter');
      const nextBtn = document.getElementById('nextChapter');
      const indicator = document.getElementById('chapterIndicator');
      const backBtn = document.getElementById('backBtn');
      const chapterSelect = document.getElementById('chapterSelect');

      let chapters = [];
      let currentIndex = -1;
      let totalPages = 0;
      let loadedPages = 0;
      let isLoading = false;

      backBtn.addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = 'series.html?id=' + seriesId;
      });

      fetch('data/series.json')
        .then(r => r.json())
        .then(data => {
          const seriesData = data.find(s => s.id === seriesId);
          if (!seriesData) throw new Error('Series tidak ditemukan');
          chapters = seriesData.chapters.sort((a,b) => b.num - a.num);
          currentIndex = chapters.findIndex(c => c.folder === chapterFolder);
          if (currentIndex === -1) currentIndex = 0;

          titleEl.textContent = seriesData.title;

          chapterSelect.innerHTML = '';
          chapters.forEach((c, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = 'Chapter ' + c.num;
            if (i === currentIndex) opt.selected = true;
            chapterSelect.appendChild(opt);
          });

          chapterSelect.addEventListener('change', function() {
            const idx = parseInt(this.value);
            if (idx !== currentIndex) {
              currentIndex = idx;
              const ch = chapters[currentIndex];
              history.pushState(null, '', 'reader.html?series=' + seriesId + '&chapter=' + ch.folder);
              resetAndLoadChapter(currentIndex);
              window.scrollTo(0, 0);
            }
          });

          resetAndLoadChapter(currentIndex);
        })
        .catch(err => {
          pagesEl.innerHTML = `<div class="empty">Error: ${err.message}</div>`;
        });

      function resetAndLoadChapter(index) {
        pagesEl.innerHTML = '';
        totalPages = 0;
        loadedPages = 0;
        isLoading = false;
        loadChapter(index);
        updateNav();
      }

      function loadChapter(index) {
        const ch = chapters[index];
        if (!ch) return;
        const base = 'series/' + seriesId + '/' + ch.folder + '/';
        const formats = ['jpg', 'png', 'webp', 'jpeg', 'bmp'];
        const batchSize = 10;

        function pad(n) { return String(n).padStart(2, '0'); }

        function probePage(pageNum) {
          return new Promise((resolve) => {
            if (pageNum > 200) return resolve(null); // batas maksimal 200 halaman
            let attempt = 0;
            const img = new Image();
            const tryNext = () => {
              if (attempt >= formats.length) {
                return resolve(null); // tidak ada format yang cocok
              }
              const src = base + pad(pageNum) + '.' + formats[attempt];
              img.onload = () => resolve(src);
              img.onerror = () => { attempt++; tryNext(); };
              img.src = src;
            };
            tryNext();
          });
        }

        async function loadBatch(startPage) {
          isLoading = true;
          let loadedInBatch = 0;
          for (let i = startPage; i < startPage + batchSize; i++) {
            const src = await probePage(i);
            if (src) {
              const img = document.createElement('img');
              img.src = src;
              img.loading = 'lazy';
              img.decoding = 'async';
              pagesEl.appendChild(img);
              loadedInBatch++;
              totalPages = Math.max(totalPages, i);
            } else {
              break; // jika tidak ada lagi, stop
            }
          }
          loadedPages = totalPages;
          isLoading = false;

          if (loadedInBatch === 0 && startPage === 1) {
            pagesEl.innerHTML = '<div class="empty">Tidak ada gambar di folder ini.</div>';
          }
        }

        // Load batch pertama (1-10)
        loadBatch(1);

        // Scroll listener untuk load batch berikutnya
        let scrollTimeout;
        window.addEventListener('scroll', function() {
          clearTimeout(scrollTimeout);
          scrollTimeout = setTimeout(() => {
            if (isLoading) return;
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 800) {
              if (loadedPages < 200) {
                loadBatch(loadedPages + 1);
              }
            }
          }, 200);
        });

        // Simpan progress
        try {
          localStorage.setItem('gitmanhwa_progress_' + seriesId, JSON.stringify({
            chapter: ch.folder,
            scrollY: 0
          }));
        } catch(e) {}
      }

      function updateNav() {
        indicator.textContent = (currentIndex + 1) + ' / ' + chapters.length;
        prevBtn.disabled = currentIndex === chapters.length - 1;
        nextBtn.disabled = currentIndex === 0;
        if (chapterSelect) chapterSelect.value = currentIndex;
      }

      const newPrev = prevBtn.cloneNode(true);
      const newNext = nextBtn.cloneNode(true);
      prevBtn.parentNode.replaceChild(newPrev, prevBtn);
      nextBtn.parentNode.replaceChild(newNext, nextBtn);

      newPrev.addEventListener('click', function() {
        if (currentIndex < chapters.length - 1) {
          currentIndex++;
          const ch = chapters[currentIndex];
          history.pushState(null, '', 'reader.html?series=' + seriesId + '&chapter=' + ch.folder);
          resetAndLoadChapter(currentIndex);
          window.scrollTo(0, 0);
        }
      });

      newNext.addEventListener('click', function() {
        if (currentIndex > 0) {
          currentIndex--;
          const ch = chapters[currentIndex];
          history.pushState(null, '', 'reader.html?series=' + seriesId + '&chapter=' + ch.folder);
          resetAndLoadChapter(currentIndex);
          window.scrollTo(0, 0);
        }
      });

      // Keyboard
      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') newPrev.click();
        if (e.key === 'ArrowRight') newNext.click();
      });
    })();
  </script>
</body>
</html>
