<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reader - GITMANHWA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== READER HEADER ===== -->
  <div class="reader-header">
    <a href="#" id="backBtn">←</a>
    <div class="reader-title" id="readerTitle">Loading...</div>
    <select id="chapterSelect" class="chapter-select"></select>
  </div>

  <!-- ===== PAGES ===== -->
  <div class="reader-pages" id="pages">
    <div class="empty">Memuat gambar...</div>
  </div>

  <!-- ===== NAVIGASI ===== -->
  <div class="reader-nav">
    <button id="prevChapter">‹ Sebelumnya</button>
    <span id="chapterIndicator">1 / 1</span>
    <button id="nextChapter">Berikutnya ›</button>
  </div>

  <!-- ===== OVERLAY FLOATING BUTTONS ===== -->
  <div class="reader-overlay-buttons">
    <button class="overlay-btn" id="settingsBtn" title="Pengaturan">
      <span class="overlay-icon">⚙️</span>
    </button>
    <button class="overlay-btn" id="playPauseBtn" title="Autoscroll">
      <span class="overlay-icon" id="playIcon">▶️</span>
    </button>
    <button class="overlay-btn" id="chapterListBtn" title="Daftar Chapter">
      <span class="overlay-icon">☰</span>
    </button>
  </div>

  <!-- ===== MODAL SETTINGS ===== -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Settings</h3>
        <button class="close-modal" id="closeSettings">✕</button>
      </div>
      
      <div class="settings-body">
        <div class="settings-group">
          <label class="settings-label">Page Quality</label>
          <div class="settings-select-wrapper">
            <select id="qualitySelect" class="settings-select">
              <option value="auto">Select mirror url</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>

        <div class="settings-group">
          <label class="settings-label">Autoscroll Speed</label>
          <div class="settings-slider-wrapper">
            <input type="range" id="speedSlider" min="0.5" max="1.5" step="0.25" value="1.0">
            <div class="slider-labels">
              <span>0.5</span>
              <span>0.75</span>
              <span>1.0</span>
              <span>1.25</span>
              <span>1.5</span>
            </div>
          </div>
        </div>

        <div class="settings-actions">
          <button class="settings-btn-primary" id="saveSettings">Save</button>
          <button class="settings-btn-secondary" id="laterSettings">Later</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== MODAL CHAPTER LIST ===== -->
  <div class="modal" id="chapterListModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Search Chapter</h3>
        <button class="close-modal" id="closeChapterList">✕</button>
      </div>
      
      <div class="chapter-search-wrapper">
        <input type="text" id="chapterSearchInput" placeholder="🔍 Search" class="chapter-search-input">
        <button class="chapter-search-btn" id="scrollToBottomBtn">↓</button>
      </div>

      <div class="chapter-list-scroll" id="chapterListContainer">
        <!-- Diisi JS -->
      </div>
    </div>
  </div>

  <script>
    (function() {
      // Blokir copy
      document.addEventListener('copy', (e) => e.preventDefault());
      document.addEventListener('cut', (e) => e.preventDefault());
      document.addEventListener('contextmenu', (e) => e.preventDefault());

      const params = new URLSearchParams(location.search);
      const seriesId = params.get('series');
      const chapterFolder = params.get('chapter');

      const pagesEl = document.getElementById('pages');
      const titleEl = document.getElementById('readerTitle');
      const prevBtn = document.getElementById('prevChapter');
      const nextBtn = document.getElementById('nextChapter');
      const indicator = document.getElementById('chapterIndicator');
      const backBtn = document.getElementById('backBtn');
      const chapterSelect = document.getElementById('chapterSelect');

      // Overlay & Modal
      const settingsBtn = document.getElementById('settingsBtn');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const chapterListBtn = document.getElementById('chapterListBtn');
      const playIcon = document.getElementById('playIcon');
      const settingsModal = document.getElementById('settingsModal');
      const chapterListModal = document.getElementById('chapterListModal');
      const closeSettings = document.getElementById('closeSettings');
      const closeChapterList = document.getElementById('closeChapterList');
      const saveSettings = document.getElementById('saveSettings');
      const laterSettings = document.getElementById('laterSettings');
      const speedSlider = document.getElementById('speedSlider');
      const qualitySelect = document.getElementById('qualitySelect');
      const chapterSearchInput = document.getElementById('chapterSearchInput');
      const chapterListContainer = document.getElementById('chapterListContainer');
      const scrollToBottomBtn = document.getElementById('scrollToBottomBtn');

      let chapters = [];
      let currentIndex = -1;
      let totalPages = 0;
      let isAutoScroll = false;
      let autoScrollInterval = null;
      let autoScrollSpeed = 1.0;

      backBtn.addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = 'series.html?id=' + seriesId;
      });

      // ===== LOAD SERIES DATA =====
      fetch('data/series.json')
        .then(r => r.json())
        .then(data => {
          const seriesData = data.find(s => s.id === seriesId);
          if (!seriesData) throw new Error('Series tidak ditemukan');
          chapters = seriesData.chapters.sort((a,b) => b.num - a.num);
          currentIndex = chapters.findIndex(c => c.folder === chapterFolder);
          if (currentIndex === -1) currentIndex = 0;

          titleEl.textContent = seriesData.title;

          chapterSelect.innerHTML = '';
          chapters.forEach((c, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = 'Chapter ' + c.num;
            if (i === currentIndex) opt.selected = true;
            chapterSelect.appendChild(opt);
          });

          chapterSelect.addEventListener('change', function() {
            const idx = parseInt(this.value);
            if (idx !== currentIndex) {
              currentIndex = idx;
              const ch = chapters[currentIndex];
              history.pushState(null, '', 'reader.html?series=' + seriesId + '&chapter=' + ch.folder);
              stopAutoScroll();
              loadChapter(currentIndex);
              window.scrollTo(0, 0);
            }
          });

          // Render daftar chapter di modal
          renderChapterList();

          loadChapter(currentIndex);
        })
        .catch(err => {
          pagesEl.innerHTML = `<div class="empty">Error: ${err.message}</div>`;
        });

      // ===== LOAD CHAPTER =====
      function loadChapter(index) {
        const ch = chapters[index];
        if (!ch) return;

        stopAutoScroll();
        pagesEl.innerHTML = '';
        const base = 'series/' + seriesId + '/' + ch.folder + '/';
        const formats = ['jpg', 'png', 'webp', 'jpeg', 'bmp'];
        const maxPages = 200;

        let loadedCount = 0;

        function pad(n) { return String(n).padStart(2, '0'); }

        function tryLoadPage(pageNum) {
          if (pageNum > maxPages) {
            if (loadedCount === 0) {
              pagesEl.innerHTML = '<div class="empty">Tidak ada gambar di folder ini.</div>';
            }
            return;
          }

          let attempt = 0;
          const img = new Image();
          const tryFormat = () => {
            if (attempt >= formats.length) return;
            img.onload = function() {
              pagesEl.appendChild(img);
              loadedCount++;
              tryLoadPage(pageNum + 1);
            };
            img.onerror = function() {
              attempt++;
              tryFormat();
            };
            img.src = base + pad(pageNum) + '.' + formats[attempt];
          };
          tryFormat();
        }

        tryLoadPage(1);
        totalPages = loadedCount;

        // Simpan progress
        try {
          localStorage.setItem('gitmanhwa_progress_' + seriesId, JSON.stringify({
            chapter: ch.folder,
            scrollY: 0
          }));
        } catch(e) {}

        updateNav();
      }

      // ===== RENDER CHAPTER LIST DI MODAL =====
      function renderChapterList() {
        if (!chapterListContainer) return;
        
        chapterListContainer.innerHTML = chapters.map((c, i) => `
          <div class="chapter-list-item" data-index="${i}">
            Chapter ${c.num}
          </div>
        `).join('');

        // Klik chapter
        chapterListContainer.querySelectorAll('.chapter-list-item').forEach(item => {
          item.addEventListener('click', function() {
            const idx = parseInt(this.dataset.index);
            if (idx !== currentIndex) {
              currentIndex = idx;
              const ch = chapters[currentIndex];
              history.pushState(null, '', 'reader.html?series=' + seriesId + '&chapter=' + ch.folder);
              loadChapter(currentIndex);
              window.scrollTo(0, 0);
              chapterListModal.classList.remove('show');
            }
          });
        });
      }

      // ===== OVERLAY BUTTONS =====
      // Settings
      settingsBtn.addEventListener('click', () => {
        settingsModal.classList.add('show');
      });

      closeSettings.addEventListener('click', () => {
        settingsModal.classList.remove('show');
      });

      laterSettings.addEventListener('click', () => {
        settingsModal.classList.remove('show');
      });

      saveSettings.addEventListener('click', () => {
        autoScrollSpeed = parseFloat(speedSlider.value);
        // Simpan settings
        localStorage.setItem('gitmanhwa_settings', JSON.stringify({
          speed: autoScrollSpeed,
          quality: qualitySelect.value
        }));
        settingsModal.classList.remove('show');
        Toast.show('Pengaturan disimpan!', 'success');
      });

      // Load saved settings
      const savedSettings = localStorage.getItem('gitmanhwa_settings');
      if (savedSettings) {
        const settings = JSON.parse(savedSettings);
        autoScrollSpeed = settings.speed || 1.0;
        speedSlider.value = autoScrollSpeed;
        qualitySelect.value = settings.quality || 'auto';
      }

      // Play/Pause Autoscroll
      playPauseBtn.addEventListener('click', () => {
        if (isAutoScroll) {
          stopAutoScroll();
        } else {
          startAutoScroll();
        }
      });

      function startAutoScroll() {
        isAutoScroll = true;
        playIcon.textContent = '⏸️';
        playPauseBtn.classList.add('active');
        
        // Interval scroll berdasarkan kecepatan
        const baseSpeed = 50; // px per tick
        const interval = 1000 / (autoScrollSpeed * 10); // kecepatan dinamis
        
        autoScrollInterval = setInterval(() => {
          const scrollAmount = baseSpeed * autoScrollSpeed;
          window.scrollBy(0, scrollAmount);
          
          // Berhenti di bawah
          if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 10) {
            stopAutoScroll();
          }
        }, interval);
      }

      function stopAutoScroll() {
        isAutoScroll = false;
        playIcon.textContent = '▶️';
        playPauseBtn.classList.remove('active');
        if (autoScrollInterval) {
          clearInterval(autoScrollInterval);
          autoScrollInterval = null;
        }
      }

      // Chapter List Modal
      chapterListBtn.addEventListener('click', () => {
        chapterListModal.classList.add('show');
        chapterSearchInput.value = '';
        chapterSearchInput.focus();
        renderChapterList();
      });

      closeChapterList.addEventListener('click', () => {
        chapterListModal.classList.remove('show');
      });

      // Search chapter
      chapterSearchInput.addEventListener('input', function() {
        const q = this.value.toLowerCase().trim();
        const items = chapterListContainer.querySelectorAll('.chapter-list-item');
        items.forEach(item => {
          const text = item.textContent.toLowerCase();
          if (text.includes(q)) {
            item.style.display = 'block';
          } else {
            item.style.display = 'none';
          }
        });
      });

      // Scroll ke bawah
      scrollToBottomBtn.addEventListener('click', () => {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      });

      // ===== NAVIGASI =====
      function updateNav() {
        indicator.textContent = (currentIndex + 1) + ' / ' + chapters.length;
        prevBtn.disabled = currentIndex === chapters.length - 1;
        nextBtn.disabled = currentIndex === 0;
        if (chapterSelect) chapterSelect.value = currentIndex;
      }

      const newPrev = prevBtn.cloneNode(true);
      const newNext = nextBtn.cloneNode(true);
      prevBtn.parentNode.replaceChild(newPrev, prevBtn);
      nextBtn.parentNode.replaceChild(newNext, nextBtn);

      newPrev.addEventListener('click', function() {
        if (currentIndex < chapters.length - 1) {
          currentIndex++;
          const ch = chapters[currentIndex];
          history.pushState(null, '', 'reader.html?series=' + seriesId + '&chapter=' + ch.folder);
          stopAutoScroll();
          loadChapter(currentIndex);
          window.scrollTo(0, 0);
        }
      });

      newNext.addEventListener('click', function() {
        if (currentIndex > 0) {
          currentIndex--;
          const ch = chapters[currentIndex];
          history.pushState(null, '', 'reader.html?series=' + seriesId + '&chapter=' + ch.folder);
          stopAutoScroll();
          loadChapter(currentIndex);
          window.scrollTo(0, 0);
        }
      });

      // Keyboard shortcut
      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') newPrev.click();
        if (e.key === 'ArrowRight') newNext.click();
      });

      // ===== TOAST (Simple) =====
      const Toast = {
        show(message, type = 'info') {
          let toast = document.querySelector('.toast');
          if (!toast) {
            toast = document.createElement('div');
            toast.className = 'toast';
            document.body.appendChild(toast);
          }
          toast.textContent = message;
          toast.className = 'toast toast-' + type;
          toast.style.display = 'block';
          setTimeout(() => toast.style.display = 'none', 3000);
        }
      };

      updateNav();
    })();
  </script>
</body>
</html>
